[package]
name = "cybercord-node"
version = "0.25.1"
edition = "2021"
description = "CyberCord — serverless peer-to-peer chat (SocioCyberneering Inc.)"
license = "MIT OR Apache-2.0"

[lib]
name = "cybercord_node"
path = "src/lib.rs"

[[bin]]
name = "cybercord"
path = "src/main.rs"

[dependencies]
# end-to-end encryption of direct messages: hybrid X25519 + ML-KEM-768
# (NIST FIPS 203, post-quantum), XChaCha20-Poly1305, HKDF-SHA256
x25519-dalek = { version = "2", features = ["static_secrets"] }
ml-kem = "0.2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
# updates and article search: plain HTTPS (rustls; system roots, proxy from env)
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json", "proxy-from-env"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# invitations: QR code and a PNG card drawn with the brand fonts
qrcode = { version = "0.14", default-features = false }
ab_glyph = "0.2"
libp2p = { version = "0.54", features = [
    "tokio", "tcp", "quic", "noise", "yamux",
    "gossipsub", "mdns", "identify", "ping", "ed25519", "macros",
    "kad", "relay", "dcutr", "upnp", "request-response", "cbor",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "signal", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
eframe = { version = "0.29", default-features = true }
egui = "0.29"
# Real microphone/speaker I/O. Optional because it needs the system audio stack
# (ALSA/PipeWire on Linux). Build with `--features voice` to enable real audio.
cpal = { version = "0.15", optional = true }
# Webcam for video circles (V4L2 on Linux, Media Foundation on Windows).
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
blake3 = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg"] }
# Music messages: pure-Rust decoding of mp3 / flac / ogg-vorbis / wav / m4a-aac.
mainline = "8"
hayro = "0.9"
raw-window-handle = "0.6"
openh264 = "0.9"
mp4 = "0.14"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# Desktop notifications (D-Bus on Linux, toast on Windows).
notify-rust = "4"
# Torrent-like file transfer messages.
serde_bytes = "0.11"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4"] }
sys-locale = "0.3"

[features]
default = []
voice = ["dep:cpal"]
camera = ["dep:nokhwa"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"

[profile.release]
opt-level = 2
strip = true

# System tray: StatusNotifierItem over D-Bus on Linux (Xfce, GNOME with the
# AppIndicator extension, KDE), native tray on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
# show the hidden window from the tray (a hidden window gets no frames, so
# egui viewport commands alone cannot bring it back)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
